# Builds the nationwide court directory (public/data/us) from OpenStreetMap (Geofabrik's daily state extracts) and commits it,
# so players anywhere in the US see the courts and park details near them.
# Runs monthly, by hand from the Actions tab, and whenever the build changes on a claude/ branch.
#
# Eight jobs each build a group of states in parallel (about 1.1 GB of downloads each), then one job merges
# them into map tiles and commits. A group that fails keeps that group's earlier courts; the rest still publish.
name: Refresh court directory

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 1 * *'
  push:
    branches: ['claude/**']
    paths:
      - scripts/build-us-courts.mjs
      - .github/workflows/refresh-us-courts.yml

permissions:
  contents: write

concurrency:
  group: refresh-us-courts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Ten-second check that the source answers before eight runners start downloading.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Same download logic as the build, on a big and a small state.
      - name: Check Geofabrik
        run: node scripts/build-us-courts.mjs --probe GA CA RI

  states:
    needs: preflight
    name: Build ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: CA, states: 'CA'}
          - {group: TX+, states: 'TX IN OK MT DE WY'}
          - {group: FL+, states: 'FL TN SC CT NV RI AK'}
          - {group: NY+, states: 'NY AZ MA AL NM WV DC'}
          - {group: PA+, states: 'PA VA MD CO UT MS NH PR'}
          - {group: NC+, states: 'NC WA LA OR IA NE ME'}
          - {group: OH+, states: 'OH MI NJ MN KY AR SD VT'}
          - {group: IL+, states: 'IL GA MO WI KS ID HI ND'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      # Filtered state data is cached for the month, so a re-run only downloads states that didn't finish.
      - name: Cache key
        id: key
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .cache/us-courts
          key: us-courts-${{ steps.key.outputs.month }}-${{ matrix.group }}-${{ github.run_id }}
          restore-keys: us-courts-${{ steps.key.outputs.month }}-${{ matrix.group }}-

      - name: Build ${{ matrix.states }}
        timeout-minutes: 80
        run: |
          set +e
          node scripts/build-us-courts.mjs ${{ matrix.states }}
          code=$?
          if [ "$code" != 0 ] && [ "$code" != 2 ]; then exit "$code"; fi
          echo "code=$code" >> "$GITHUB_ENV"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/us-courts/*.geojsonseq
          key: us-courts-${{ steps.key.outputs.month }}-${{ matrix.group }}-${{ github.run_id }}

      # Hand only this group's built states to the merge job.
      - name: Collect built states
        if: always()
        run: |
          mkdir -p built
          for s in ${{ matrix.states }}; do [ -f ".cache/us-courts/state-$s.json" ] && cp ".cache/us-courts/state-$s.json" built/; done
          ls built
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: states-${{ strategy.job-index }}
          path: built/
          if-no-files-found: ignore
          retention-days: 7

      - name: Flag states that still need a run
        if: env.code == '2'
        run: |
          echo '::warning::Some states in ${{ matrix.group }} could not be built; their earlier courts are kept. Re-run this job to resume.'
          exit 1

  publish:
    needs: [preflight, states]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: states-*
          path: .cache/us-courts
          merge-multiple: true
      - name: Write map tiles
        run: |
          mkdir -p .cache/us-courts && ls .cache/us-courts
          node scripts/build-us-courts.mjs --tiles-only
      - name: Check the directory code
        run: node --test tests/us-courts.test.js
      - name: Commit the directory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898699+github-actions[bot]@users.noreply.github.com'
          git add public/data/us
          if git diff --cached --quiet; then echo 'No changes.'; exit 0; fi
          locations=$(node -e "console.log(require('./public/data/us/index.json').locations)")
          git commit -m "Refresh the nationwide court directory ($locations locations)" -m 'Data © OpenStreetMap contributors, ODbL 1.0.'
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 10))
          done
          exit 1
